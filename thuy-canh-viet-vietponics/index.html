<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content:"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#007aff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="preconnect" href="https://vietponics.vn" crossorigin />
    <link rel="dns-prefetch" href="https://vietponics.vn" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("cache:banners.v2");
          if (!raw) return;
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr) || !arr[0] || !arr[0].image) return;
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = "image";
          l.href = arr[0].image;
          l.setAttribute("fetchpriority", "high");
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>

    <title>Zalo Mini App</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- built script files will be auto injected -->

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
